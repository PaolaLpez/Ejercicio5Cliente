name: Frontend CI/CD Pipeline - Circuito DevOps

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build, Unit Tests & Verification
    runs-on: ubuntu-latest

    steps:
    - name: 1. Checkout del Repositorio
      uses: actions/checkout@v4

    - name: 2. Configurar Entorno Java 21 (Temurin)
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: 3. Permisos de Ejecución a Maven Wrapper
      run: chmod +x ./mvnw || true

    - name: 4. Compilación y Ejecución de Pruebas Unitarias (Surefire)
      run: ./mvnw clean test -B

    - name: 5. Verificación de Salud del Empaquetado JAR
      run: ./mvnw clean package -DskipTests -B

    - name: 6. Publicar Reportes de Pruebas JUnit
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: surefire-test-reports-frontend
        path: target/surefire-reports/
